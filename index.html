<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Личный Кабинет</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E3E7DE;
    --card: #FFFFFF;
    --btn-dark: #1F3A12;
    --btn-dark-hover: #2c521a;
    --lilac: #C98FD3;
    --lilac-soft: rgba(201, 143, 211, 0.22);
    --lime: #B6D98C;
    --lime-soft: rgba(182, 217, 140, 0.35);
    --text: #162410;
    --muted: #5C6B55;
    --border: #D4DDD0;
    --radius-card: 28px;
    --radius-sm: 16px;
    --shadow: 0 10px 30px rgba(31, 58, 18, 0.06);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
  }

  /* ВЕРХНЕЕ МЕНЮ (ДЕСКТОП) */
  header.top-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(227, 231, 222, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(31, 58, 18, 0.08);
    padding: 12px 24px;
  }

  .nav-inner {
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.03em;
    color: var(--btn-dark);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .nav-links {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 0;
  }
  .nav-links::-webkit-scrollbar { display: none; }

  .nav-btn {
    border: none;
    background: transparent;
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 99px;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.65); }
  .nav-btn.active {
    background: var(--btn-dark);
    color: #fff;
  }

  .backup-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ОСНОВНОЙ КОНТЕЙНЕР */
  main {
    max-width: 1240px;
    margin: 24px auto;
    padding: 0 20px;
  }

  .section { display: none; animation: fadeIn 0.25s ease; }
  .section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* БОЛЬШАЯ ШАПКА РАЗДЕЛА С ГРАДИЕНТОМ */
  .hero-header {
    background: linear-gradient(125deg, var(--lime) 0%, #d8e5c8 48%, var(--lilac) 100%);
    border-radius: var(--radius-card);
    padding: 32px 36px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
  }

  .hero-title-block h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--btn-dark);
    margin-bottom: 8px;
  }

  .hero-title-block p {
    font-size: 15px;
    font-weight: 500;
    color: #293d1f;
    max-width: 600px;
  }

  .hero-stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(6px);
    padding: 12px 18px;
    border-radius: 20px;
    min-width: 120px;
  }
  .stat-pill .num {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--btn-dark);
    line-height: 1.1;
  }
  .stat-pill .lbl {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 2px;
  }

  /* СЕТКИ И КАРТОЧКИ */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 22px; margin-bottom: 22px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; margin-bottom: 22px; }

  .card {
    background: var(--card);
    border-radius: var(--radius-card);
    padding: 26px;
    box-shadow: var(--shadow);
  }

  .card h2, .card h3 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* ФОРМЫ И КНОПКИ */
  input, select, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    background: #FAFBF9;
    color: var(--text);
    outline: none;
    transition: 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--btn-dark);
    background: #fff;
  }

  .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }

  .btn {
    background: var(--btn-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--btn-dark-hover); transform: translateY(-1px); }

  .btn-lilac { background: var(--lilac); color: var(--text); }
  .btn-lilac:hover { opacity: 0.9; }

  .btn-lime { background: var(--lime); color: var(--text); }
  .btn-lime:hover { opacity: 0.9; }

  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { background: var(--bg); }

  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 12px; }
  .btn-icon { padding: 6px 9px; font-size: 12px; border-radius: 10px; }

  /* ШКАЛА 1-5 */
  .scale { display: flex; gap: 8px; margin-top: 6px; }
  .scale button {
    width: 38px; height: 38px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #FAFBF9;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }
  .scale button.selected {
    background: var(--btn-dark);
    color: #fff;
    border-color: var(--btn-dark);
  }

  /* ЭЛЕМЕНТЫ СПИСКОВ */
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 14px;
    background: #F7F9F5;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    transition: 0.15s;
  }
  .item-row.done .item-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .item-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .item-left input[type="checkbox"] {
    width: 19px; height: 19px;
    accent-color: var(--btn-dark);
    cursor: pointer;
    flex-shrink: 0;
  }
  .item-text {
    font-size: 14px;
    font-weight: 500;
    word-break: break-word;
  }
  .item-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    background: var(--lime-soft);
    color: var(--btn-dark);
  }
  .tag-lilac { background: var(--lilac-soft); color: #4a1d54; }

  /* ТАЙМЕР */
  .timer-num {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -0.04em;
    text-align: center;
    color: var(--btn-dark);
    margin: 10px 0;
    font-variant-numeric: tabular-nums;
  }

  /* ПРИВЫЧКИ МЕСЯЦ */
  .table-wrap { overflow-x: auto; padding-bottom: 6px; }
  table.habit-table { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12px; }
  table.habit-table th { color: var(--muted); font-weight: 700; padding: 6px 4px; }
  table.habit-table td.name-col {
    font-weight: 700; white-space: nowrap; padding-right: 12px; text-align: left;
  }
  table.habit-table td.day-cell {
    width: 26px; height: 26px; min-width: 26px;
    border-radius: 8px;
    background: #F1F4EE;
    text-align: center;
    cursor: pointer;
    font-weight: 800;
    color: transparent;
    transition: 0.15s;
  }
  table.habit-table td.day-cell.active {
    background: var(--btn-dark);
    color: var(--lime);
  }

  /* АНГЛИЙСКИЙ */
  .word-new {
    background: var(--lilac-soft);
    border-bottom: 2px solid var(--lilac);
    padding: 1px 5px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
  }
  .flashcard {
    background: linear-gradient(135deg, var(--lime-soft), var(--lilac-soft));
    border-radius: 22px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
    user-select: none;
  }
  .chip {
    display: inline-block;
    padding: 7px 13px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    margin: 4px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  /* МОБИЛЬНОЕ НИЖНЕЕ МЕНЮ */
  @media (max-width: 820px) {
    header.top-nav {
      position: fixed;
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      border-bottom: none;
      border-top: 1px solid rgba(31, 58, 18, 0.12);
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.96);
    }
    .brand { display: none; }
    .nav-links { width: 100%; justify-content: flex-start; }
    .hero-header { padding: 24px 20px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    main { margin-top: 14px; padding: 0 14px; }
  }
</style>
</head>
<body>

<header class="top-nav">
  <div class="nav-inner">
    <div class="brand">🌿 Мой Кабинет</div>
    <nav class="nav-links" id="navLinks">
      <button class="nav-btn active" onclick="switchTab('home', this)">🏠 Главная</button>
      <button class="nav-btn" onclick="switchTab('week', this)">📅 Неделя</button>
